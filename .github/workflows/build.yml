name: Construire les applications (APK + Windows)
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SIGL-Saisie-MEG-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx electron-builder --win nsis portable --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: SIGL-Saisie-MEG-Windows
          path: |
            dist/*.exe
  publier:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: fichiers }
      - run: |
          mkdir sortie
          cp fichiers/SIGL-Saisie-MEG-APK/app-debug.apk sortie/SIGL-Saisie-MEG.apk
          cp fichiers/SIGL-Saisie-MEG-Windows/*.exe sortie/
          ls -la sortie
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: SIGL Saisie MEG v1.0.${{ github.run_number }}
          body: "APK Android (SIGL-Saisie-MEG.apk) et Windows (installateur Setup + version portable)."
          files: sortie/*
